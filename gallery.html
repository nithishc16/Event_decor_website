<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gallery | Rainbow Events By Sathish</title>


<!-- CSS -->

<link
    rel="stylesheet"
    href="assets/css/style.css"
>


<!-- GOOGLE FONTS -->

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
>


</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="nav container">


        <!-- LOGO -->

        <a
            class="logo"
            href="index.html"
        >

            🌈

            <span>

                Rainbow Events By Sathish

                <small>
                    Celebrate Every Moment
                </small>

            </span>

        </a>


        <!-- MOBILE MENU -->

        <button
            class="menu"
            id="menu"
        >

            ☰

        </button>


        <!-- NAVIGATION -->

        <nav id="navlinks">

            <a href="index.html">
                Home
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="gallery.html">
                Gallery
            </a>

            <a href="aboutus.html">
                About Us
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>


    </div>

</header>



<!-- ================= PAGE HERO ================= -->

<section class="pagehero">

    <div class="container">


        <p class="tag">
            OUR WORK
        </p>


        <h1>
            Rainbow Events Gallery
        </h1>


        <p>
            Add your real decoration photographs inside
            the category folders.
        </p>


    </div>

</section>



<!-- ================= GALLERY SECTION ================= -->

<section class="section container">


    <!-- CATEGORY FILTER BUTTONS -->

    <div class="filters">


        <button
            data-filter="all"
            class="active"
        >

            All

        </button>


        <button data-filter="birthday">

            Birthday

        </button>


        <button data-filter="wedding">

            Wedding

        </button>


        <button data-filter="baby">

            Baby Shower

        </button>


        <button data-filter="anniversary">

            Anniversary

        </button>


        <button data-filter="other">

            Other Events

        </button>


    </div>



    <!-- ================= GALLERY GRID ================= -->

    <div
        class="gallery"
        id="galleryGrid"
    >

        <!--
            Gallery images will be loaded here
            using script.js

            Example categories:

            Birthday
            Wedding
            Baby Shower
            Anniversary
            Other Events
        -->

    </div>


</section>



<!-- ================= FOOTER ================= -->

<footer>

    <div class="copyright">

        © 2026 Rainbow Events By Sathish.
        All Rights Reserved.

    </div>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script src="assets/js/script.js"></script>


</body>

</html>
